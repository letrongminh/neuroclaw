services:
  # ─────────────────────────────────────────────
  # NeuroClaw Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm neuroclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  neuroclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: neuroclaw-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.neuroclaw/config.json:ro
      - neuroclaw-workspace:/root/.neuroclaw/workspace
      - neuroclaw-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["neuroclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # NeuroClaw Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  neuroclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: neuroclaw-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.neuroclaw/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - neuroclaw-workspace:/root/.neuroclaw/workspace
      # NPM cache for faster MCP server installs
      - neuroclaw-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  neuroclaw-workspace:
  neuroclaw-npm-cache: # Cache npm packages to speed up MCP server installations
