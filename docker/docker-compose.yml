services:
  # ─────────────────────────────────────────────
  # NeuroClaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm neuroclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  neuroclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/letrongminh/neuroclaw:latest
    container_name: neuroclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.neuroclaw
    entrypoint: ["neuroclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # NeuroClaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  neuroclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/letrongminh/neuroclaw:latest
    container_name: neuroclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.neuroclaw

  # ─────────────────────────────────────────────
  # NeuroClaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  neuroclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: ghcr.io/letrongminh/neuroclaw:launcher
    container_name: neuroclaw-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - NEUROCLAW_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- NEUROCLAW_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.neuroclaw
