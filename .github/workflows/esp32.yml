name: esp32
# NeuroClaw-ESP (esp32/): host tests of the decisions, the QEMU example end to
# end against a fake Telegram, LLM and search on the runner, and the Wi-Fi
# example built for every supported chip.
on:
  push:
    branches: [main]
    paths: ["esp32/**", ".github/workflows/esp32.yml"]
  pull_request:
    paths: ["esp32/**", ".github/workflows/esp32.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    name: Decisions on the host (ASan, UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: esp32/scripts/host_test.sh
  targets:
    name: Builds for ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6]
    defaults:
      run:
        shell: bash
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/esp32/.ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            esp32/.ccache
            esp32/examples/wifi/managed_components
          key: esp32-${{ matrix.target }}-idf5.4-${{ hashFiles('esp32/examples/wifi/main/idf_component.yml') }}-${{ github.sha }}
          restore-keys: esp32-${{ matrix.target }}-idf5.4-${{ hashFiles('esp32/examples/wifi/main/idf_component.yml') }}-
      - name: Build the Wi-Fi example
        run: |
          . "$IDF_PATH/export.sh"
          esp32/scripts/build_targets.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: esp32-build-${{ matrix.target }}
          path: esp32/examples/wifi/build-*.log
  qemu:
    name: Telegram, LLM, gate, memory, cron, web, heartbeat, console — two boots on QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build the QEMU example
        working-directory: esp32/examples/qemu
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Install Espressif QEMU
        run: python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
      - name: End to end
        run: |
          . "$IDF_PATH/export.sh"
          python3 esp32/scripts/qemu_e2e.py esp32/examples/qemu/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-qemu-uart
          path: esp32/examples/qemu/build/e2e-uart-*.log
